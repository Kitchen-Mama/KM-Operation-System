<!-- Weekly Shipping Plan Section — extracted from index.html (Phase 3-8). Injected into #shipping-plan-mount by KM.partialLoader on the page lifecycle mount. Markup unchanged. -->
            <section id="shippingplan-section" class="module-section">
                <div id="shippingPlanSection">
                    <div class="shipping-plan__header-row">
                        <h2 class="page-title">Weekly Shipping Plan</h2>
                        <div class="shipping-plan__filters">
                            <select id="spCountryFilter" class="shipping-plan__filter shipping-plan__filter--country" onchange="renderShippingPlan()">
                                <option value="">All Countries</option>
                                <option value="US">US</option>
                                <option value="UK">UK</option>
                                <option value="DE">DE</option>
                            </select>
                            <select id="spStatusFilter" class="shipping-plan__filter shipping-plan__filter--status" onchange="filterByStatus()">
                                <option value="all">All Active</option>
                                <option value="draft">Draft</option>
                                <option value="pendingApproval">Pending Approval</option>
                                <option value="approved">Approved</option>
                                <option value="completed">Completed</option>
                                <option value="cancelled">Cancelled</option>
                            </select>
                        </div>
                    </div>
                    <h2 id="draftSectionTitle" style="margin-top: 40px; margin-bottom: 20px;">Draft</h2>
                    <div id="shippingPlanCards"></div>
                    
                    <h2 id="pendingSectionTitle" style="margin-top: 40px; margin-bottom: 20px;">Pending Approval</h2>
                    <div id="pendingApprovalCards"></div>
                    
                    <h2 id="approvedSectionTitle" style="margin-top: 40px; margin-bottom: 20px;">Approved</h2>
                    <div id="approvedCards"></div>

                    <h2 id="completedSectionTitle" style="margin-top: 40px; margin-bottom: 20px; display: none;">Completed (Decision Layer finished — handed off to Shipment)</h2>
                    <div id="completedCards" style="display: none;"></div>

                    <h2 id="cancelledSectionTitle" style="margin-top: 40px; margin-bottom: 20px; display: none;">Cancelled</h2>
                    <div id="cancelledCards" style="display: none;"></div>
                </div>
            </section>
