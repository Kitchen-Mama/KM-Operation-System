<!-- Weekly Shipping Plan Section — extracted from index.html (Phase 3-8). Injected into #shipping-plan-mount by KM.partialLoader on the page lifecycle mount. Markup unchanged. -->
            <section id="shippingplan-section" class="module-section">
                <div id="shippingPlanSection">
                    <div class="shipping-plan__header-row">
                        <h2 class="page-title">Weekly Shipping Plan</h2>
                        <div class="shipping-plan__filters">
                            <select id="spCountryFilter" class="shipping-plan__filter shipping-plan__filter--country" onchange="renderShippingPlan()">
                                <option value="">All Countries</option>
                                <option value="US">US</option>
                                <option value="UK">UK</option>
                                <option value="DE">DE</option>
                            </select>
                            <select id="spStatusFilter" class="shipping-plan__filter shipping-plan__filter--status" onchange="filterByStatus()">
                                <option value="all">All Active</option>
                                <option value="draft">Draft</option>
                                <option value="pendingApproval">Pending Approval</option>
                                <option value="approved">Approved</option>
                                <option value="completed">Completed</option>
                                <option value="cancelled">Cancelled</option>
                            </select>
                        </div>
                    </div>
                    <h3 id="draftSectionTitle" class="plan-section-title">Draft <span class="plan-section-title__count" id="draftSectionCount">0</span></h3>
                    <div id="shippingPlanCards"></div>

                    <h3 id="pendingSectionTitle" class="plan-section-title">Pending Approval <span class="plan-section-title__count" id="pendingSectionCount">0</span></h3>
                    <div id="pendingApprovalCards"></div>

                    <h3 id="approvedSectionTitle" class="plan-section-title">Approved <span class="plan-section-title__count" id="approvedSectionCount">0</span></h3>
                    <div id="approvedCards"></div>

                    <h3 id="completedSectionTitle" class="plan-section-title" style="display: none;">Completed (Decision Layer finished — handed off to Shipment) <span class="plan-section-title__count" id="completedSectionCount">0</span></h3>
                    <div id="completedCards" style="display: none;"></div>

                    <h3 id="cancelledSectionTitle" class="plan-section-title" style="display: none;">Cancelled <span class="plan-section-title__count" id="cancelledSectionCount">0</span></h3>
                    <div id="cancelledCards" style="display: none;"></div>
                </div>
            </section>
