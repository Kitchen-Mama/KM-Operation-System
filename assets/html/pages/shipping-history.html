<!-- Shipping History / Shipment Overview Section — extracted from index.html (Frontend Modularization Phase 3-1).
     Markup is identical to the original inline section; injected into #shippinghistory-mount by KM.partialLoader.
     NOTE: route key (shippinghistory) and section id (shippinghistory-section) intentionally unchanged. -->
<section id="shippinghistory-section" class="module-section">
    <div class="page-shipping-history">
        <div class="page-header">
            <h2 class="page-title">Shipment Overview</h2>
        </div>

        <!-- Filter Bar -->
        <div class="fc-filter-bar">
            <!-- Date Range -->
            <div class="filter-group">
                <label>Date</label>
                <button type="button" class="history-date-trigger" id="historyDateTrigger">
                    <span class="history-date-trigger-text">Last 30 days</span>
                    <span class="history-date-trigger-icon">▼</span>
                </button>
            </div>

            <!-- Country — shared KM.ui.multiFilter (Round 3). Options derived from live runtime data by
                 _shSyncFilterOptions (no hardcoded options); mounted by _shInitFilters. -->
            <div class="filter-group filter-group--dropdown">
                <label>Country</label>
                <div class="sh-filter-mount" id="sh-f-country-mount"></div>
            </div>

            <!-- Shipping Method — shared KM.ui.multiFilter (Round 3). DOM order keeps Shipping Method
                 before SKU (Round 1). Options derived from live runtime data; multi-value OR-within. -->
            <div class="filter-group filter-group--dropdown">
                <label>Shipping Method</label>
                <div class="sh-filter-mount" id="sh-f-method-mount"></div>
            </div>

            <!-- SKU -->
            <div class="filter-group filter-group--sku">
                <label>SKU</label>
                <input type="text" placeholder="Search SKU..." />
            </div>

            <!-- Search Button -->
            <div class="filter-group">
                <label>&nbsp;</label>
                <button class="btn btn-primary">Search</button>
            </div>
        </div>

        <!-- Results Area -->
        <div class="history-results">
            <!-- Empty State -->
            <div class="history-empty-state">
                <p>Use the filters above and click <strong>Search</strong> to view shipping history.</p>
            </div>

            <!-- Results List -->
            <div class="history-list" hidden></div>
        </div>
    </div>
</section>
