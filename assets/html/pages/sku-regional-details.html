<!-- SKU Regional Details (SKU Domain v2.0 Layer 2 — sku_regional_details).
     Master-SKU-first workspace V2: left = one row per Master SKU; right = country tabs → (Company·Marketplace
     selector when >1) → 6 sections. Regional identity + compliance-document fields. NO pricing, NO tax/duty
     write. Tax & Commercial is a READ-ONLY join (tax_referral_rates SSOT). Master name/series/category and
     operational status are READ-ONLY joins. -->
<section id="sku-regional-details-section" class="module-section srd-page">

    <div class="srd-note" id="srd-mode-note"></div>

    <!-- Page header -->
    <div class="srd-header">
        <div class="srd-header__title">
            <h2 class="page-title">SKU Regional Details</h2>
            <p class="srd-sub">Select a Master SKU, then a country, to view and edit its regional / marketplace records.</p>
        </div>
        <div class="srd-header__actions">
            <span class="srd-count" id="srd-count"></span>
        </div>
    </div>

    <!-- Single-row toolbar: filters left (Category → Series → Search), action right -->
    <div class="srd-toolbar" id="srd-toolbar">
        <!-- Category / Series filters use the ONE shared searchable multi-select (KM.ui.multiFilter),
             System Repair 2 §13/§14 — replaces the former native <select>s. -->
        <div id="srd-f-category-mount" class="srd-filter srd-filter--multi" aria-label="Filter by category"></div>
        <div id="srd-f-series-mount" class="srd-filter srd-filter--multi" aria-label="Filter by series"></div>
        <input type="text" id="srd-search" class="srd-input srd-search" placeholder="Search SKU…" aria-label="Search master SKUs">
        <span class="srd-toolbar__spacer"></span>
        <button type="button" class="srd-btn srd-btn--primary" id="srd-add-btn" onclick="srdOpenEdit(null, 'add')">+ Add Regional Details</button>
    </div>

    <!-- Two-panel workspace: compact Master SKU list (left) + country-tab detail (right) -->
    <div class="srd-workspace" id="srd-workspace">
        <div class="srd-list-panel">
            <div class="srd-list" id="srd-list" role="listbox" aria-label="Master SKUs"></div>
            <div class="srd-pager" id="srd-pager"></div>
        </div>
        <div class="srd-detail-panel" id="srd-detail">
            <div class="srd-detail-empty">Select a Master SKU to view its regional records.</div>
        </div>
    </div>

    <!-- Master SKU read-only drawer -->
    <div class="srd-drawer-overlay" id="srd-drawer-overlay" style="display:none;" onclick="srdCloseDrawer(event)">
        <aside class="srd-drawer" id="srd-drawer" role="dialog" aria-modal="true" aria-label="Master SKU information" onclick="event.stopPropagation()"></aside>
    </div>

    <!-- Edit / Add Regional Detail modal -->
    <div class="srd-modal-overlay" id="srd-edit-overlay" style="display:none;" onclick="srdCloseEdit(event)">
        <div class="srd-modal" id="srd-edit-modal" role="dialog" aria-modal="true" aria-label="Edit regional detail" onclick="event.stopPropagation()"></div>
    </div>
</section>
