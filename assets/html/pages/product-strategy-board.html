<!-- Product Strategy Board (PRODUCT-STRATEGY-P1-B5 §4).

     NOT REACHABLE. This partial is not mounted by index.html, has no menu item and no entry in the
     app.js section map, so KM.partialLoader never fetches it. §4 forbids enabling the navigation
     entry and §11 forbids changing it — production visibility for this feature is zero by
     construction, exactly as the accessor has been since P1-B1.

     WHAT IS DELIBERATELY ABSENT, compared with the prototype's index.html:

       · the demonstration banner. It reads "Preview data — not connected to Operation System
         Database", which is the truest sentence on the prototype and a false one here. A production
         page that inherited it would be labelling live prices as a demonstration; a production page
         that kept the element and emptied it would be one edit away from doing so again.
       · the sidebar, the rail toggle and the nav list. The Operation System shell owns navigation.
         The board binds those handlers only where the elements exist (psb-board-ui.js `on`).
       · the self-test panel. It asserts the preview banner, the preview prices and the disabled
         Operation DB adapter — a prototype instrument measuring a prototype.

     WHAT IS PRESENT: the scope ladder and the view, which ARE the board; Presentation and Print,
     which §8 lists as board features; the tooltip layer the `?` popovers render into; and one state
     host, which is where every answer that is not "here is the chart" is written. -->
<section id="product-strategy-board-section" class="module-section psb-page">

    <div class="psb-header">
        <div class="psb-header__title">
            <h2 class="page-title">Product Strategy Board</h2>
            <p class="psb-sub">One site at a time — a company, a country and a marketplace. Prices from
                two sites are never pooled on one axis.</p>
        </div>
        <div class="psb-header__actions">
            <!-- P1-B8D-R7 - THE LONG EXPLANATION LIVES HERE NOW.
                 The awaiting state carried two lines about why a board reads one site at a time,
                 permanently, above the three controls it was explaining. It is a good paragraph and
                 it answers a question a person asks once, so it moved behind a control. The button
                 is BUILT BY THE PAGE CONTROLLER rather than written here, because it owns the text
                 and the popover's open/close contract; this is the empty host it lands in, first in
                 the action group so it reads as belonging to the title rather than to Print.
                 It is an `i`, not a `?`: the chart's question marks come off the screen in the same
                 round, and a page that removed six and added a seventh would have moved one rather
                 than made a decision. -->
            <span class="psb-help" id="psb-help-host"></span>
            <!-- Board features, not shell features. Bound by psb-board-ui.js where present. -->
            <button class="btn btn-quiet" id="btnPresent" type="button" title="Presentation mode">Presentation</button>
            <button class="btn btn-quiet" id="btnPrint" type="button" title="Print or save as PDF">Print / PDF</button>
        </div>
    </div>

    <!-- P1-B7 — THE SCENARIO PRINT STRIP, and it is not the prototype's banner. The prototype's
         said "Preview data — not connected to Operation System Database", which is why P1-B5 dropped
         it: on live prices that sentence is false. This one is EMPTY until a Meeting scenario is
         applied, and then it carries the sentence that has to survive being printed and carried out
         of the room — that the numbers on the page are simulated and are not prices the company
         charges. psb-board-ui.js `renderScenarioMark()` owns its content and nothing else writes
         here. -->
    <div id="banner" class="psb-printbanner" role="status" aria-live="polite"></div>

    <!-- THE SIX VIEWS OF THIS BOARD (P1-B8B §2/§5) — and as of this round they are the Operation
         System's OWN tab component rather than a second one.

         P1-B7 put the prototype's six `.navbtn`s here and restyled them in the page stylesheet:
         its own hover, its own active underline, its own overflow behaviour. That is a second tab
         component, which §5 forbids, and the application already has one — `.km-tab-rail` in
         components.css, paired with assets/js/utils/tab-rail.js for wheel-to-horizontal scrolling
         and focus-into-view, shared today by Campaign Risk, Inventory Replenishment and Order
         Planning. The `km-tab-rail` class on the list is ALSO how psb-board-ui.js knows which host
         it is rendering into: the prototype's list does not carry it and keeps the sidebar rendering.

         `role="tablist"` rather than a `<nav>` landmark, deliberately. The Operation System sidebar
         moves between PAGES and is the navigation; this moves between views of ONE page. The six
         are one tab stop with Arrow-key movement, not six stops in front of the page's controls. -->
    <div class="psb-viewnav">
        <ul class="nav km-tab-rail" id="nav"></ul>
    </div>

    <!-- Which of the six is showing, and the category inside it. Also the one line that tells a
         printed page what it is a picture of. -->
    <div class="crumbs psb-crumbs" id="crumbs"></div>

    <!-- P1-B8D-R5 / R7 - ONE FILTER PANEL, IN THE ORDER A PERSON WALKS IT.

         Company -> Country -> Marketplace -> Category -> Series -> More filters -> Meeting scenario.

         TWO OWNERS, ONE PANEL, AND THE BOUNDARY IS NOT THE READER'S PROBLEM. The three site tiers
         belong to the PAGE CONTROLLER: only `productPricing.siteUniverse.get` knows which sites
         exist, and R5 exists because the live page read ten of them and offered no control at all.
         Category and Series belong to the BOARD: they are derived from the rows of the one site it
         has loaded and cannot be known before the read. That is a real seam in the code, and until
         this round it was also a seam on the screen - two bars stacked, the upper one holding the
         controls, the lower one repeating Company/Country/Marketplace beside the data. During a
         site change the two disagreed, and the stale one was the one next to the numbers.

         So the two hosts sit inside ONE card and the stylesheet flattens the wrappers with
         `display: contents`, putting the seven controls on one row in that order. Neither renderer
         had to learn about the other's DOM, and the board is told at mount that it is not the owner
         of the site (`siteOwnedByPage`), so it no longer draws the second set at all. -->
    <div class="psb-filters" id="psb-filters">
        <div id="psb-site-host" class="psb-site-host"></div>
        <!-- The compact command bar renders here. On this page it opens at Category -> Series,
             because the three site tiers are the controls immediately to its left in the same row
             (P1-B4 SS1/SS3/SS5). More filters and Meeting scenario stay as the two secondary
             entrances at the end. -->
        <section class="scope" id="scope" aria-label="Scope"></section>
    </div>

    <!-- P1-B8D-R6 - THE CONTROLS COME BEFORE THE SENTENCE ABOUT THEM.
         This host used to sit ABOVE the chooser, so the live page read "Choose a site to analyse."
         and only then showed the thing to choose with. A message that asks for an action belongs
         after the action, not in front of it; and every OTHER state written here is about what the
         panel above just did, which is the same argument a second time. -->
    <!-- EVERY ANSWER THAT IS NOT A CHART IS WRITTEN HERE, and the chart is never drawn beside one.
         SOURCE_EMPTY, SOURCE_PARTIALLY_READABLE, STOP_DATA_INTEGRITY, SOURCE_NOT_CONNECTED,
         FEATURE_DISABLED, SCHEMA_CONTRACT_MISMATCH, CONTRACT_MISMATCH and the page's own
         SITE_UNIVERSE_NOT_AVAILABLE all land in this one element. There is no state in which a
         fixture is loaded instead.
         P1-B8D-R7 - AND THE BOARD IS TAKEN DOWN WHEN ONE OF THEM IS WRITTEN. Until this round that
         sentence was true only of the FIRST answer: nothing removed a chart that had already been
         drawn, so changing Company left the previous site's whole board on screen under a notice
         asking you to choose a site. `C.clearBoard()` in the page controller empties #nav, #crumbs,
         #banner, #scope and #view, which is every host the board draws into. -->
    <div id="psb-state-host" class="psb-state-host"></div>

    <!-- The chart, the KPI row, the tables and the Insight drawer. -->
    <section class="view" id="view"></section>

    <p class="printhint" id="printHint">Print or save as PDF from the header. The findings drawer opens
        in print.</p>

    <div class="tip" id="tip" hidden></div>
</section>
