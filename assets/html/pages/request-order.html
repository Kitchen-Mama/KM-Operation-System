<!-- Request Order Section (下單系統) — extracted from index.html (Phase 3-5). Injected into #request-order-mount by KM.partialLoader on the page lifecycle mount. Markup unchanged. -->
            <section id="request-order-section" class="module-section page-request-order">
                <div class="page-header">
                    <h2 class="page-title">下單系統</h2>
                </div>
                
                <!-- Filter Bar (Part 1): left = Country / Marketplace / Risk / Show / SKU / Search;
                     right = Confirm Site / All Request / Send Request (action group, right-aligned,
                     same height as Search — NOT in the Category tabs row, NOT above the card).
                     Country / Marketplace / Risk / SKU filtering uses AND semantics (see
                     _applyRequestOrderFilters; empty selection = unconstrained). Category is a TAB (below). -->
                <div class="ro-filters">
                    <div class="ro-filter ro-filter--dropdown">
                        <label>Country</label>
                        <button type="button" class="ro-dropdown-trigger" data-filter="country">
                            <span class="ro-dropdown-text">All</span>
                            <span class="ro-dropdown-icon">▼</span>
                        </button>
                        <div class="ro-dropdown-panel" data-filter="country">
                            <label class="ro-checkbox-item"><input type="checkbox" value="" checked onchange="toggleRequestOrderAll(this, 'country')"> <strong>All</strong></label>
                            <label class="ro-checkbox-item"><input type="checkbox" value="US" checked onchange="updateRequestOrderFilter('country')"> US</label>
                            <label class="ro-checkbox-item"><input type="checkbox" value="UK" checked onchange="updateRequestOrderFilter('country')"> UK</label>
                            <label class="ro-checkbox-item"><input type="checkbox" value="DE" checked onchange="updateRequestOrderFilter('country')"> DE</label>
                            <label class="ro-checkbox-item"><input type="checkbox" value="CA" checked onchange="updateRequestOrderFilter('country')"> CA</label>
                            <label class="ro-checkbox-item"><input type="checkbox" value="JP" checked onchange="updateRequestOrderFilter('country')"> JP</label>
                            <label class="ro-checkbox-item"><input type="checkbox" value="AU" checked onchange="updateRequestOrderFilter('country')"> AU</label>
                        </div>
                    </div>

                    <div class="ro-filter ro-filter--dropdown">
                        <label>Marketplace</label>
                        <button type="button" class="ro-dropdown-trigger" data-filter="marketplace">
                            <span class="ro-dropdown-text">All</span>
                            <span class="ro-dropdown-icon">▼</span>
                        </button>
                        <div class="ro-dropdown-panel" data-filter="marketplace">
                            <label class="ro-checkbox-item"><input type="checkbox" value="" checked onchange="toggleRequestOrderAll(this, 'marketplace')"> <strong>All</strong></label>
                            <label class="ro-checkbox-item"><input type="checkbox" value="Amazon" checked onchange="updateRequestOrderFilter('marketplace')"> Amazon</label>
                            <label class="ro-checkbox-item"><input type="checkbox" value="Shopify" checked onchange="updateRequestOrderFilter('marketplace')"> Shopify</label>
                            <label class="ro-checkbox-item"><input type="checkbox" value="Target" checked onchange="updateRequestOrderFilter('marketplace')"> Target</label>
                        </div>
                    </div>

                    <!-- Risk — placeholder filter (options fixed until the risk engine exists). -->
                    <div class="ro-filter ro-filter--dropdown">
                        <label>Risk</label>
                        <button type="button" class="ro-dropdown-trigger" data-filter="risk">
                            <span class="ro-dropdown-text">All</span>
                            <span class="ro-dropdown-icon">▼</span>
                        </button>
                        <div class="ro-dropdown-panel" data-filter="risk">
                            <label class="ro-checkbox-item"><input type="checkbox" value="" checked onchange="toggleRequestOrderAll(this, 'risk')"> <strong>All</strong></label>
                            <label class="ro-checkbox-item"><input type="checkbox" value="High" checked onchange="updateRequestOrderFilter('risk')"> High</label>
                            <label class="ro-checkbox-item"><input type="checkbox" value="Medium" checked onchange="updateRequestOrderFilter('risk')"> Medium</label>
                            <label class="ro-checkbox-item"><input type="checkbox" value="Low" checked onchange="updateRequestOrderFilter('risk')"> Low</label>
                        </div>
                    </div>

                    <!-- Show (Part 1) — sits between Risk and SKU. Confirmed/Pending filter rows by
                         their site-confirmation state; All / All Request show everything. -->
                    <div class="ro-filter ro-filter--show">
                        <label>Show</label>
                        <select id="ro-show-mode" class="ro-filter-select" onchange="setRequestOrderShowMode(this.value)">
                            <option value="all">All</option>
                            <option value="confirmed">Confirmed</option>
                            <option value="pending">Pending</option>
                            <option value="allRequest">All Request</option>
                        </select>
                    </div>

                    <div class="ro-filter">
                        <label>SKU</label>
                        <input type="text" class="ro-filter-sku" placeholder="Enter SKU..." oninput="updateRequestOrderFilter('sku')" onchange="updateRequestOrderFilter('sku')" />
                    </div>

                    <div class="ro-filter ro-filter--search">
                        <label>&nbsp;</label>
                        <button type="button" class="ro-btn ro-btn--primary" onclick="handleRequestOrderSearch()">Search</button>
                    </div>

                    <!-- Right-side action group: Confirmed Scope Status (read-only) / AI Plan / Request Type / Send
                         Request. (2026-07-28 UI: Clear Filters removed; Confirm Site temporarily removed — its
                         backend/DB/confirmed data are untouched; the status label stays read-only. AI Plan is a
                         suggestion-refresh action, NOT a submit — it never Sends or Confirms.) -->
                    <div class="ro-filter ro-filter--actions">
                        <label class="ro-confirm-status" id="ro-confirm-status">No site confirmed yet</label>
                        <div class="ro-action-group">
                            <button type="button" class="ro-btn ro-btn--ai" id="ro-ai-plan-btn" onclick="handleRequestOrderAiPlan()" title="Generate order suggestions" aria-label="Generate order suggestions">
                                <svg class="ro-ai-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 4.6L18.5 9.5 13.9 11.4 12 16l-1.9-4.6L5.5 9.5l4.6-1.9L12 3z"></path><path d="M19 14l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8L19 14z"></path></svg>
                                <span>AI Plan</span>
                            </button>
                            <select id="ro-request-type" class="ro-action-select">
                                <option value="all">All Request</option>
                                <option value="t1">T1 Request</option>
                                <option value="t2">T2 Request</option>
                                <option value="t3">T3 Request</option>
                            </select>
                            <button type="button" class="ro-btn ro-btn--primary" onclick="handleSendRequest()">Send Request</button>
                            <!-- F1-4B-FM5 · manual batch: ONE server recalculation of ALL site scopes → UPSERT
                                 order_planning_gap. No per-SKU HTTP loop, no browser recompute. -->
                            <button type="button" class="ro-btn" id="ro-recalc-all-btn" onclick="handleRecalcAllOrderPlanningGap()" title="Recalculate the materialized order-planning gap for all sites" aria-label="Recalculate all sites">Recalculate All Sites</button>
                            <!-- F1-4B-FM5-R4J-LIVE4 — manual Cancel (backend-authoritative; shown only while a job is active). Completed rows are preserved. -->
                            <button type="button" class="ro-btn ro-btn--cancel" id="ro-cancel-recalc-btn" onclick="handleCancelOrderPlanningGapJob()" title="Cancel the running recalculation (completed sites are kept)" aria-label="Cancel recalculation" style="display:none">Cancel</button>
                        </div>
                    </div>
                </div>

                <div class="ro-panel ro-header km-category-card">
                    <!-- Category tabs ONLY (Part 2) — no action buttons here. Populated from
                         sku_details.category by _populateRequestOrderCategoryTabs(). The shared
                         .km-category-card / __rail classes (System Repair 2 §9) make this the ONE
                         canonical Category-bar frame reused by Inventory Replenishment; the page-local
                         .ro-header / .ro-tabs--category rules load later and keep this page's exact gap. -->
                    <div class="ro-tabs ro-tabs--category km-category-card__rail km-tab-rail" id="ro-category-tabs">
                        <button class="km-tab-rail__tab is-active" data-category="All" onclick="setRequestOrderCategory('All', this)">All</button>
                    </div>
                </div>
                
                <div class="ro-panel ro-table-wrapper">
                    <div class="dual-layer-table dual-layer-table--multi-header ro-table">
                        <div class="table-header-bar">
                            <div class="fixed-header">
                                <div class="header-cell">SKU</div>
                            </div>
                            <div class="scroll-header-viewport">
                                <div class="scroll-header" id="ro-scroll-header">
                                    <!-- Risk/Country/Marketplace rowspan headers -->
                                    <div class="km-table__header-cell km-table__header-cell--rowspan" style="left: 0; width: 60px;">Risk</div>
                                    <div class="km-table__header-cell km-table__header-cell--rowspan" style="left: 60px; width: 100px;">Country</div>
                                    <div class="km-table__header-cell km-table__header-cell--rowspan" style="left: 160px; width: 120px;">Marketplace</div>
                                    
                                    <!-- 第一層表頭：群組標題 -->
                                    <div class="km-table__header-row km-table__header-row--level1">
                                        <!-- Upcoming FC (2個子欄位) -->
                                        <div class="km-table__header-cell km-table__header-cell--group-start" style="width:280px;">Upcoming FC</div>
                                        <!-- Inventory & Ongoing (4個子欄位) -->
                                        <div class="km-table__header-cell km-table__header-cell--group-start" style="width:560px;">Inventory &amp; Ongoing</div>
                                        <!-- Coverage & Time (2個子欄位) -->
                                        <div class="km-table__header-cell km-table__header-cell--group-start" style="width:200px;">Coverage &amp; Time</div>
                                        <!-- Shortage (3個子欄位) - 隱藏但保有篩選功能 -->
                                        <div class="km-table__header-cell" style="width:300px; display:none;">Shortage</div>
                                        <!-- Decision (1個子欄位) -->
                                        <div class="km-table__header-cell km-table__header-cell--group-start" style="width:200px;">Decision</div>
                                    </div>
                                    <!-- 第二層表頭：詳細欄位 -->
                                    <div class="km-table__header-row km-table__header-row--level2">
                                        <!-- Upcoming FC 子欄位 (2個) -->
                                        <div class="km-table__header-cell km-table__header-cell--group-start" style="width:140px;">Basic(T3)</div>
                                        <div class="km-table__header-cell" style="width:140px;">Special Events</div>
                                        <!-- Inventory & Ongoing 子欄位 (4個) -->
                                        <div class="km-table__header-cell km-table__header-cell--group-start" style="width:140px;">Site Stock</div>
                                        <div class="km-table__header-cell" style="width:140px;">3rd Party</div>
                                        <div class="km-table__header-cell" style="width:140px;">Factory Stock</div>
                                        <div class="km-table__header-cell" style="width:140px;">Ongoing Orders</div>
                                        <!-- Coverage & Time 子欄位 (2個): Remaining 起始群組邊界 -->
                                        <div class="km-table__header-cell km-table__header-cell--group-start" style="width:100px;">Remaining</div>
                                        <div class="km-table__header-cell" style="width:100px;">Lead Time</div>
                                        <!-- Shortage 子欄位 (3個) - 隱藏但保有篩選功能 -->
                                        <div class="km-table__header-cell" style="width:100px; display:none;">M1</div>
                                        <div class="km-table__header-cell" style="width:100px; display:none;">M2</div>
                                        <div class="km-table__header-cell" style="width:100px; display:none;">M3</div>
                                        <!-- Decision 子欄位 (1個): Suggest Order 起始群組邊界 (Lead Time | Suggest Order) -->
                                        <div class="km-table__header-cell km-table__header-cell--group-start" style="width:200px;">Suggest Order</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="table-body-bar">
                            <div class="fixed-col">
                                <div class="fixed-body" id="ro-fixed-body"></div>
                            </div>
                            <div class="scroll-col" id="ro-scroll-col">
                                <div class="scroll-body" id="ro-scroll-body"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Pagination footer — shared .km-table-footer layout (outside the table markup);
                         populated by _roRenderPagination (25 rows/page). -->
                    <div class="km-table-footer" id="ro-pagination"></div>
                </div>
            </section>
