<!-- Supply Chain Canvas Section — extracted from index.html (Phase 3-11). Injected into #supplychain-mount by KM.partialLoader on the page lifecycle mount. Markup unchanged. -->
            <section id="supplychain-section" class="module-section is-hidden">

                <div class="sc-page-header">
                    <h2>Supply Chain Canvas</h2>
                </div>
                
                <div class="sc-canvas-shell">
                    <div class="sc-toolbar">
                        <button class="sc-tool sc-tool--select is-active" title="Select Item">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e3a8a" stroke-width="2">
                                <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
                            </svg>
                        </button>
                        <button class="sc-tool sc-tool--text" title="Add Text">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e3a8a" stroke-width="2">
                                <line x1="4" y1="7" x2="20" y2="7"/>
                                <line x1="9" y1="20" x2="15" y2="20"/>
                                <line x1="12" y1="7" x2="12" y2="20"/>
                            </svg>
                        </button>
                        <button class="sc-tool sc-tool--note" title="Add Note">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e3a8a" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                <polyline points="14 2 14 8 20 8"/>
                                <line x1="8" y1="13" x2="16" y2="13"/>
                                <line x1="8" y1="17" x2="16" y2="17"/>
                            </svg>
                        </button>
                        <button class="sc-tool sc-tool--shape" title="Add Shape">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e3a8a" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                            </svg>
                        </button>
                        <button class="sc-tool sc-tool--highlight" title="Highlight">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e3a8a" stroke-width="2">
                                <path d="M9 11l3 3L22 4"/>
                                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                            </svg>
                        </button>
                        <button class="sc-tool sc-tool--arrow-style" title="Arrow Style" id="arrowStyleBtn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e3a8a" stroke-width="2">
                                <line x1="5" y1="12" x2="19" y2="12"/>
                                <polyline points="15 8 19 12 15 16"/>
                            </svg>
                        </button>
                        <!-- Arrow Style Panel -->
                        <div class="sc-arrow-style-panel" id="arrowStylePanel">
                            <div class="sc-stroke-options">
                                <button class="sc-stroke-btn" data-width="1" title="細">
                                    <div style="width:30px;height:1px;background:#000;"></div>
                                </button>
                                <button class="sc-stroke-btn" data-width="2" title="中">
                                    <div style="width:30px;height:2px;background:#000;"></div>
                                </button>
                                <button class="sc-stroke-btn" data-width="3" title="粗">
                                    <div style="width:30px;height:3px;background:#000;"></div>
                                </button>
                                <button class="sc-stroke-btn" data-width="4" title="特粗">
                                    <div style="width:30px;height:4px;background:#000;"></div>
                                </button>
                            </div>
                            <div class="sc-line-type-options">
                                <button class="sc-line-type-btn" data-type="solid">實線</button>
                                <button class="sc-line-type-btn" data-type="dashed">虛線</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="sc-canvas-viewport">
                        <div class="sc-canvas-content" id="scCanvas"></div>

                        <!-- Empty-state hint: anchored to the viewport (not the pan/zoom canvas),
                             so it stays centred in view. Toggled by renderItems() when the canvas
                             has no items/arrows. -->
                        <div class="sc-empty-state" id="scEmptyState">
                            <div style="font-size: 3rem;">🗺️</div>
                            <div style="font-weight: 500;">Supply Chain Canvas</div>
                            <div style="font-size: 0.85rem; opacity: 0.7;">拖曳畫布移動 | 滾輪縮放 | 點擊百分比重置</div>
                        </div>

                        <div class="sc-zoom-control">
                            <button class="sc-zoom-btn sc-zoom-out" title="縮小">-</button>
                            <span class="sc-zoom-label" title="點擊重置視圖">100%</span>
                            <button class="sc-zoom-btn sc-zoom-in" title="放大">+</button>
                        </div>
                    </div>
                    
                    <!-- Shape Selector Modal -->
                    <div class="sc-modal-overlay" id="scShapeOverlay" onclick="closeShapeModal()"></div>
                    <div class="sc-shape-modal" id="scShapeModal">
                        <h3 class="sc-shape-modal-title">選擇形狀</h3>
                        <div class="sc-shape-options">
                            <div class="sc-shape-option" onclick="selectShape('rectangle')">
                                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#1e3a8a" stroke-width="2">
                                    <rect x="5" y="10" width="30" height="20" rx="2"/>
                                </svg>
                                <span class="sc-shape-option-label">矩形</span>
                            </div>
                            <div class="sc-shape-option" onclick="selectShape('triangle')">
                                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#1e3a8a" stroke-width="2">
                                    <path d="M20 8 L35 32 L5 32 Z"/>
                                </svg>
                                <span class="sc-shape-option-label">三角形</span>
                            </div>
                            <div class="sc-shape-option" onclick="selectShape('diamond')">
                                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#1e3a8a" stroke-width="2">
                                    <path d="M20 5 L35 20 L20 35 L5 20 Z"/>
                                </svg>
                                <span class="sc-shape-option-label">菱形</span>
                            </div>
                            <div class="sc-shape-option" onclick="selectShape('square')">
                                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#1e3a8a" stroke-width="2">
                                    <rect x="8" y="8" width="24" height="24" rx="2"/>
                                </svg>
                                <span class="sc-shape-option-label">正方形</span>
                            </div>
                            <div class="sc-shape-option" onclick="selectShape('rounded-rect')">
                                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#1e3a8a" stroke-width="2">
                                    <rect x="5" y="10" width="30" height="20" rx="8"/>
                                </svg>
                                <span class="sc-shape-option-label">倒圓角矩形</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
