<!-- Promotion Risk Tracker / Campaign Risk Section — extracted from index.html (Phase 3-10). Injected into #campaign-risk-mount by KM.partialLoader on the page lifecycle mount. Markup unchanged. -->
            <section id="campaign-risk-section" class="module-section">
                <div class="cr-page-header">
                    <div class="cr-page-title">
                        <h2>Promotion Risk Tracker</h2>
                        <p>Rolling 90-day promotion analysis by SKU</p>
                    </div>
                    <div class="cr-page-actions">
                        <!-- Site scope: Country → Marketplace (→ Company). Derived from marketplace_skus (active).
                             No default; SKUs load only after a full scope resolves. -->
                        <div class="cr-site">
                            <label class="cr-site__field">
                                <span class="cr-site__label">Country</span>
                                <select id="cr-country" onchange="onCrCountryChange()" aria-label="Country"><option value="">Select Country</option></select>
                            </label>
                            <label class="cr-site__field">
                                <span class="cr-site__label">Marketplace</span>
                                <select id="cr-marketplace" onchange="onCrMarketplaceChange()" aria-label="Marketplace" disabled><option value="">Select Marketplace</option></select>
                            </label>
                        </div>
                        <button class="cr-btn cr-btn--danger" id="cr-del-promo-btn" onclick="crDeletePromotions()" disabled title="Select a country and marketplace first">Delete Promotions</button>
                        <button class="cr-btn cr-btn--primary" id="cr-add-promo-btn" onclick="crAddPromotion()" disabled title="Select a country and marketplace first">+ Add Promotion</button>
                    </div>
                </div>
                
                <div class="cr-kpi-cards" id="cr-kpi-cards"></div>
                
                <!-- Category / Series filters (2026-07-28): two single-select Tab Rails (was two multi-select
                     checkbox dropdowns). Category is row 1, Series is row 2 — still two independent filter
                     dimensions, each with an "All" option and a Name + Count badge. Selecting a Category
                     cascades the Series rail to its compatible series. Uses the SHARED .km-tab-rail (single-row
                     horizontal scroll) so this page matches Inventory Replenishment / Order System. -->
                <div class="cr-filter-panel cr-filter-panel--rails">
                    <div class="cr-filter-group cr-filter-group--rail">
                        <div class="cr-filter-group-label">Product Category</div>
                        <div class="cr-tab-rail km-tab-rail" id="cr-category-rail"></div>
                    </div>
                    <div class="cr-filter-group cr-filter-group--rail">
                        <div class="cr-filter-group-label">Product Series</div>
                        <div class="cr-tab-rail km-tab-rail" id="cr-series-rail"></div>
                    </div>
                </div>
                
                <div class="dual-layer-table cr-table">
                    <div class="table-header-bar">
                        <div class="fixed-header"><div class="header-cell">SKU</div></div>
                        <div class="scroll-header-viewport">
                            <div class="scroll-header" id="cr-table-scroll-header">
                                <div class="header-cell cr-hcell--sitesku">Site SKU</div>
                                <div class="header-cell cr-hcell--img">Image</div>
                                <div class="header-cell cr-hcell--name">Product Name</div>
                                <div class="header-cell">90-Day Promo</div>
                                <div class="header-cell">Future Promo</div>
                                <div class="header-cell">Annual Events</div>
                                <div class="header-cell">LPS</div>
                                <div class="header-cell">Risk Level</div>
                                <div class="header-cell">Total Promos</div>
                            </div>
                        </div>
                    </div>
                    <div class="table-body-bar">
                        <div class="fixed-col">
                            <div class="fixed-body" id="cr-table-fixed-body"></div>
                        </div>
                        <div class="scroll-col">
                            <div class="scroll-body" id="cr-table-scroll-body"></div>
                        </div>
                    </div>
                </div>
                
                <div class="cr-pagination" id="cr-pagination"></div>
            </section>
